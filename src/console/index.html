<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Author Console — Devlog Narrator</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --link: #58a6ff;
      --primary: #238636;
      --primary-hover: #2ea043;
      --danger: #da3633;
      --warn: #d29922;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .auth-card {
      max-width: 440px;
      margin: 5rem auto;
      padding: 2.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .auth-card h2 { margin-bottom: 0.5rem; color: #fff; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text); }
    input[type="text"], input[type="password"], input[type="date"], textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: 2px solid var(--link);
      border-color: transparent;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #21262d; color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: #30363d; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-warn { background: var(--warn); color: #000; }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
    .error-msg { background: rgba(218, 54, 51, 0.15); border: 1px solid var(--danger); color: #f85149; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; }
    .info-msg { background: rgba(88, 166, 255, 0.15); border: 1px solid var(--link); color: #58a6ff; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; }
    .success-msg { background: rgba(35, 134, 54, 0.15); border: 1px solid var(--primary); color: #3fb950; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; }
    .counter { font-size: 0.75rem; color: var(--text-muted); text-align: right; margin-top: 0.3rem; }
    .dashboard-layout { max-width: 1000px; width: 100%; margin: 0 auto; padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
    .console-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
    .user-area { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; color: var(--text-muted); }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .tab-btn { background: none; border: none; color: var(--text-muted); padding: 0.6rem 1.2rem; cursor: pointer; font-size: 0.95rem; font-weight: 600; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--text); border-bottom-color: #f78166; }
    .section-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; }
    .drafts-layout { display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px; min-height: 550px; overflow: hidden; }
    .drafts-sidebar { border-right: 1px solid var(--border); padding: 1rem; }
    .draft-items-list { list-style: none; margin-top: 0.75rem; }
    .draft-item { padding: 0.75rem; border-radius: 6px; cursor: pointer; margin-bottom: 0.5rem; border: 1px solid transparent; }
    .draft-item:hover { background: #21262d; }
    .draft-item.selected { background: #1f2937; border-color: var(--link); }
    .draft-item-date { font-size: 0.75rem; color: var(--text-muted); }
    .draft-item-title { font-weight: 600; font-size: 0.9rem; margin-top: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .draft-editor-pane { padding: 1.5rem; display: flex; flex-direction: column; }
    .editor-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .editor-actions { display: flex; gap: 0.5rem; }
    .badge { font-size: 0.7rem; padding: 0.15rem 0.4rem; border-radius: 4px; font-weight: 600; }
    .badge-warn { background: var(--warn); color: #000; }
    .published-table { list-style: none; margin-top: 1rem; }
    .pub-row { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid var(--border); }
    .pub-info { display: flex; flex-direction: column; gap: 0.25rem; }
    .pub-meta { font-size: 0.8rem; color: var(--text-muted); }
    .pub-actions { display: flex; gap: 0.5rem; }
    .loading, .empty-state { padding: 3rem; text-align: center; color: var(--text-muted); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script defer src="/console/console.js"></script>
</body>
</html>
